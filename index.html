<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0e0f" />

    <title>KnurlWorks — Gymwear Built for the Alternative Lifter</title>
    <meta
      name="description"
      content="KnurlWorks is alternative gymwear for lifters who don't blend in. Heavyweight tees, technical training gear and streetwear built to survive PRs and stand out on the street."
    />
    <meta name="keywords" content="alternative gymwear, gym clothing, streetwear gym apparel, training gear, gym bro fashion, lifting apparel" />
    <meta name="author" content="KnurlWorks" />
    <link rel="canonical" href="https://knurlworks.com.au/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KnurlWorks — Gymwear Built for the Alternative Lifter" />
    <meta property="og:description" content="Heavyweight tees, technical training gear and streetwear built to survive PRs and stand out on the street." />
    <meta property="og:url" content="https://knurlworks.com.au/" />
    <meta property="og:image" content="/og-cover.jpg" />
    <meta property="og:site_name" content="KnurlWorks" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KnurlWorks — Gymwear Built for the Alternative Lifter" />
    <meta name="twitter:description" content="Alternative gymwear for lifters who don't blend in." />
    <meta name="twitter:image" content="/og-cover.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: Jost (display), Inter (body), IBM Plex Mono (utility/tags) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "KnurlWorks",
        "description": "Alternative gymwear for lifters who don't blend in.",
        "url": "https://knurlworks.com.au"
      }
    </script>

    <!-- Prevent theme flash: read stored/system preference before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('knurlworks-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
